[package]
name = "pt-seeds-watcher"
version = "1.0.0"
edition = "2021"
description = "Watches the Play Together seed shop on screen and alerts you when chosen seeds are in stock. Read-only: it never clicks or buys."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = "2"
notify-rust = "4"
# OpenGL (glow) is the light renderer we use; wgpu stays as a fallback.
eframe = { version = "0.37", features = ["glow"] }
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_System_WinRT",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[build-dependencies]
winresource = "0.1"

# Image work is slow without optimisations, so even debug builds get some.
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
# Smaller exe for players to download.
lto = true
codegen-units = 1
strip = true
panic = "abort"
