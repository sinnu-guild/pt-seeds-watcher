[package]
name = "pt-seeds-watcher"
version = "0.1.0"
edition = "2021"
description = "Watches the Play Together seed shop on screen and alerts you when chosen seeds are in stock. Read-only: it never clicks or buys."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = "2"
notify-rust = "4"

# Image matching is slow without optimisations, so even debug builds of
# dependencies and this crate get some.
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
