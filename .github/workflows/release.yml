# Push a tag like v1.0.1 and this builds the exe, publishes a GitHub release
# with it attached, then sets "latest_app_version" in seeds.json so everyone's
# app shows "A new version is available".
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match Cargo.toml version $version. Bump the version, commit, and tag again."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Publish release
        run: |
          cat > notes.md <<'EOF'
          Play Together Seed Watcher for PC. Get notified when the seeds you want are in stock.

          **Download `pt-seeds-watcher.exe` below and double-click it.** Nothing to install.
          The "How to use" tab in the app walks you through the rest.

          <sub>The first time you run it, Windows might show a blue "Windows protected your PC" box. That's normal for new apps from small, indie developers without a paid code-signing certificate. Click **More info**, then **Run anyway**. You only see it once.</sub>
          EOF
          gh release create "$TAG" target/release/pt-seeds-watcher.exe --title "$TAG" --notes-file notes.md

      - name: Tell existing apps about the new version
        run: |
          git fetch origin main
          git checkout -B main origin/main
          sed -i -E "s/(\"latest_app_version\": *\")[^\"]*\"/\1$VERSION\"/" seeds.json
          if git diff --quiet seeds.json; then
            echo "seeds.json already says $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "latest version is now $VERSION"
          git push origin main
